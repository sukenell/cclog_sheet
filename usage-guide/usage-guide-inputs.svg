  </defs>
  <rect width="640" height="360" rx="28" fill="url(#bg)"/>
  <rect x="88" y="66" width="464" height="228" rx="22" fill="#eef5f1" filter="url(#shadow)"/>
  <rect x="112" y="94" width="180" height="38" rx="10" fill="#253346"/>
  <rect x="316" y="94" width="100" height="38" rx="10" fill="#68c870"/>
  <rect x="432" y="94" width="96" height="38" rx="10" fill="#f2d36b"/>
  <g fill="#253346">
