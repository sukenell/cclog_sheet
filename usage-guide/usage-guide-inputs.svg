<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Input guide thumbnail</title>
  <desc id="desc">A sheet-like panel with stat and skill input fields.</desc>
  <defs>
