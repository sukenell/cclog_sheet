<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Basic flow guide thumbnail</title>
  <desc id="desc">A compact flow from system selection to completed sheet.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#17242c"/>
      <stop offset="1" stop-color="#263a34"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#081018" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="640" height="360" rx="28" fill="url(#bg)"/>
  <g fill="none" stroke="#68c870" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M184 180h88"/>
    <path d="m260 164 20 16-20 16"/>
    <path d="M368 180h88"/>
    <path d="m444 164 20 16-20 16"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="72" y="100" width="120" height="160" rx="18" fill="#f2d36b"/>
    <rect x="260" y="92" width="120" height="176" rx="18" fill="#7fc8f8"/>
    <rect x="448" y="100" width="120" height="160" rx="18" fill="#f38ba8"/>
  </g>
  <g fill="#10202a" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">
    <text x="132" y="150" font-size="24">01</text>
    <text x="320" y="150" font-size="24">02</text>
    <text x="508" y="150" font-size="24">03</text>
  </g>
  <g fill="#10202a" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    <text x="132" y="198">SELECT</text>
    <text x="320" y="198">WRITE</text>
    <text x="508" y="198">SAVE</text>
  </g>
  <g fill="#ffffff" opacity=".68">
    <rect x="92" y="220" width="80" height="8" rx="4"/>
    <rect x="280" y="220" width="80" height="8" rx="4"/>
    <rect x="468" y="220" width="80" height="8" rx="4"/>
  </g>
</svg>
